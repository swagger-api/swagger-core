// * * * * * * * * * * * *
// Plugins
// * * * * * * * * * * * *
plugins {
    id 'java-gradle-plugin'
    // Publishing publicly
    id 'com.gradle.plugin-publish' version '2.2.1'
    // Publishing to maven
    id 'maven-publish'
}

// * * * * * * * * * * * *
// Dependencies
// * * * * * * * * * * * *

repositories {
    mavenLocal()
    mavenCentral()
}

compileJava {
    options.release = 17
}

processResources {
    // resolve at configuration time; the filesMatching closure runs at execution time
    def pluginVersion = project.version.toString()
    inputs.property 'pluginVersion', pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching('swagger-gradle-plugin.properties') {
        expand(pluginVersion: pluginVersion)
    }
}

dependencies {
    implementation gradleApi()

    testImplementation gradleTestKit()
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testImplementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    testImplementation "io.swagger.core.v3:swagger-rest:${project.version}"
    testImplementation 'org.testng:testng:7.12.0'
}

// * * * * * * * * * * * *
// Project configuration
// * * * * * * * * * * * *

project.description     = 'Gradle Plugin for Swagger core'
project.group           = 'io.swagger.core.v3'

project.ext.name        = 'swagger-gradle-plugin'
project.ext.pluginId    = 'io.swagger.core.v3.swagger-gradle-plugin'
project.ext.scm         = 'https://github.com/swagger-api/swagger-core.git'
project.ext.url         = 'https://github.com/swagger-api/swagger-core/tree/master/modules/swagger-gradle-plugin'

// Configuration for: java-gradle-plugin + com.gradle.plugin-publish
gradlePlugin {
    website = project.url
    vcsUrl = project.scm
    plugins {
        swagger {
            id = project.pluginId
            implementationClass = 'io.swagger.v3.plugins.gradle.SwaggerPlugin'
            displayName = 'Swagger Gradle Plugin'
            description = project.description
            tags.set(['swagger', 'openapi', 'api'])
            // Groovy DSL requires passing `it` as the receiver
            compatibility(it) {
                features {
                    configurationCache = true
                    isolatedProjects = true
                }
            }
        }
    }
}


test {
    useTestNG()
    systemProperty 'swagger.plugin.version', project.version
}

publishing {
    repositories {
        maven {
            url = mavenLocal().url
        }
    }
}
