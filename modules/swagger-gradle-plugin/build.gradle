// * * * * * * * * * * * *
// Plugins
// * * * * * * * * * * * *
plugins {
    id 'java-gradle-plugin'
    // Publishing publicly
    id 'com.gradle.plugin-publish' version '2.1.1'
    // Publishing to maven
    id 'maven-publish'
}

// * * * * * * * * * * * *
// Dependencies
// * * * * * * * * * * * *

repositories {
    mavenLocal()
    mavenCentral()
}

compileJava {
    options.release = 17
}

processResources {
    inputs.property 'pluginVersion', project.version
    filteringCharset = 'UTF-8'
    filesMatching('swagger-gradle-plugin.properties') {
        expand(pluginVersion: project.version)
    }
}

dependencies {
    implementation gradleApi()
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    testImplementation gradleTestKit()
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testImplementation 'com.google.guava:guava:32.1.3-jre'
    testImplementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    testImplementation "io.swagger.core.v3:swagger-rest:${project.version}"
    testImplementation 'org.testng:testng:7.10.2'
    testImplementation "org.apache.httpcomponents:httpclient:4.5.14"
    testImplementation "commons-codec:commons-codec:1.16.0"
    testImplementation "commons-io:commons-io:2.15.1"
    testImplementation "org.apache.commons:commons-compress:1.25.0"
    testImplementation "com.github.jknack:handlebars:4.5.3"
    testImplementation "com.github.jknack:handlebars-helpers:4.5.3"
}

// * * * * * * * * * * * *
// Project configuration
// * * * * * * * * * * * *

project.description     = 'Gradle Plugin for Swagger core'
project.group           = 'io.swagger.core.v3'

project.ext.name        = 'swagger-gradle-plugin'
project.ext.pluginId    = 'io.swagger.core.v3.swagger-gradle-plugin'
project.ext.scm         = 'https://github.com/swagger-api/swagger-core.git'
project.ext.url         = 'https://github.com/swagger-api/swagger-core/tree/master/modules/swagger-gradle-plugin'

// Configuration for: java-gradle-plugin + com.gradle.plugin-publish
gradlePlugin {
    website = project.url
    vcsUrl = project.scm
    plugins {
        swagger {
            id = project.pluginId
            implementationClass = 'io.swagger.v3.plugins.gradle.SwaggerPlugin'
            displayName = 'Swagger Gradle Plugin'
            description = project.description
            tags.set(['swagger', 'openapi', 'api'])
        }
    }
}


test {
    useTestNG()
    systemProperty 'swagger.plugin.version', project.version
}

publishing {
    repositories {
        maven {
            url mavenLocal().url
        }
    }
}
