name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - milestone
          - rc
          - release
        default: 'release'
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # for pushing tag later
          fetch-depth: 0                       # fetch all history and tags

      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}

      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Gradle credentials
        run: |
          mkdir -p ~/.gradle
          echo "gradle.publish.key=${GRADLE_PUBLISH_KEY}\ngradle.publish.secret=${GRADLE_PUBLISH_SECRET}" > ~/.gradle/gradle.properties

      - name: Check swagger-bom version matches root version
        run: |
          ROOT_VERSION=$(./mvnw -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:1.3.1:exec)
          BOM_VERSION=$(./mvnw -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:1.3.1:exec --file modules/swagger-bom/pom.xml)
          if [ "${ROOT_VERSION}" != "${BOM_VERSION}" ]; then
            echo "ERROR: swagger-bom version mismatch"
            exit 1
          fi

      - name: Compute release version and next development version
        id: version
        run: . ./CI/compute-release-version.sh ${{ github.event.inputs.release_type }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release commit (detached)
        run: . ./CI/prepare-release-commit.sh

      - name: Build and test
        run: |
          ./mvnw --no-transfer-progress -B install --file pom.xml
          cd modules/swagger-gradle-plugin && ./gradlew build --info && cd ../..

      - name: Deploy to Maven Central
        if: success()
        run: ./mvnw --no-transfer-progress -B -Prelease deploy

      - name: Publish Gradle plugin
        if: success()
        run: |
          cd modules/swagger-gradle-plugin
          ./gradlew publishPlugins -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}" --info
          cd ../..

      - name: Tag and push release tag
        if: success()
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Publish GitHub release
        if: success()
        run: python CI/publishRelease.py "v${RELEASE_VERSION}"

      - name: Prepare javadocs
        if: success()
        run: . ./CI/prepare-javadocs.sh

      - name: Checkout gh-pages and publish javadocs
        uses: actions/checkout@v6
        with:
          ref: "gh-pages"
          fetch-depth: 0
      - name: Publish javadocs
        if: success()
        run: |
          TMPDIR="$(dirname -- "${0}")"
          . $TMPDIR/publish-javadocs.sh

      - name: Checkout master (for wiki update)
        uses: actions/checkout@v6
        with:
          ref: "master"
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout Wiki
        if: success()
        uses: actions/checkout@v6
        with:
          repository: vpelikh/swagger-core.wiki
          token: ${{ steps.generate-token.outputs.token }}
          path: wiki
          ref: "master"
          fetch-depth: 0

      - name: Update Wiki
        if: success()
        run: |
          TMPDIR="$(dirname -- "${0}")"
          . $TMPDIR/update-wiki.sh

    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PRIVATE_PASSPHRASE }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}