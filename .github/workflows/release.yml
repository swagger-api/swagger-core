name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - milestone
          - rc
          - release
        default: 'release'
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}

      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle credentials
        run: |
          mkdir -p ~/.gradle
          echo "gradle.publish.key=${GRADLE_PUBLISH_KEY}\ngradle.publish.secret=${GRADLE_PUBLISH_SECRET}" > ~/.gradle/gradle.properties

      - name: Check swagger-bom version matches root version
        uses: ./.github/actions/check-bom-version

      - name: Compute release version
        id: version
        run: . ./CI/compute-release-version.sh ${{ github.event.inputs.release_type }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release commit (detached)
        run: . ./CI/prepare-release-commit.sh

      - name: Build and test
        run: |
          ./mvnw --no-transfer-progress -B install --file pom.xml
          cd modules/swagger-gradle-plugin && ./gradlew build --info && cd ../..

      - name: Deploy to Maven Central
        if: success()
        run: ./mvnw --no-transfer-progress -B -Prelease deploy

      - name: Publish Gradle plugin
        if: success()
        run: |
          cd modules/swagger-gradle-plugin
          ./gradlew publishPlugins -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}" --info
          cd ../..

      - name: Tag and push release tag
        if: success()
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create draft GitHub Release
        if: success()
        run: |
          # Determine base tag for release notes
          if [ "$IS_PRERELEASE" = "true" ]; then
            BASE_TAG=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          else
            BASE_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')
          fi
          # Build release title
          if [ "$IS_PRERELEASE" = "true" ]; then
            if [[ "$RELEASE_VERSION" =~ -M ]]; then
              TITLE="Swagger-core ${RELEASE_VERSION} (Milestone) released!"
            elif [[ "$RELEASE_VERSION" =~ -RC ]]; then
              TITLE="Swagger-core ${RELEASE_VERSION} (Release Candidate) released!"
            else
              TITLE="Swagger-core ${RELEASE_VERSION} released!"
            fi
          else
            TITLE="Swagger-core ${RELEASE_VERSION} released!"
          fi
          gh release create "v${RELEASE_VERSION}" \
            --title "$TITLE" \
            --notes-start-tag "$BASE_TAG" \
            --generate-notes \
            --draft \
            --prerelease="$IS_PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish draft release
        if: success()
        run: gh release edit "v${RELEASE_VERSION}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Javadocs for swagger-annotations
        if: success()
        run: ./mvnw -pl modules/swagger-annotations javadoc:javadoc -DskipTests

      - name: Prepare javadocs
        if: success()
        run: . ./CI/prepare-javadocs.sh

      - name: Checkout gh-pages and publish javadocs
        uses: actions/checkout@v7
        with:
          ref: "gh-pages"
          fetch-depth: 0

      - name: Publish javadocs
        if: success()
        run: |
          TMPDIR="$(dirname -- "${0}")"
          . $TMPDIR/publish-javadocs.sh

      # Post-release: bump SNAPSHOT on master (only for final release)
      - name: Bump SNAPSHOT version on master (final release only)
        if: success() && github.event.inputs.release_type == 'release'
        run: . ./CI/bump-snapshot.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PRIVATE_PASSPHRASE }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}