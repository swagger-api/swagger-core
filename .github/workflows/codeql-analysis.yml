name: "Code scanning - action"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 19 * * 1'

jobs:
  CodeQL-Build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: 'maven'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build with Maven
        run: ./mvnw --no-transfer-progress -B -e -T 1C install --file pom.xml

      - name: Build Gradle plugin
        working-directory: modules/swagger-gradle-plugin
        run: ./gradlew build --info --build-cache --parallel --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Upload Maven test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-codeql
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**